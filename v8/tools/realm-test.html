<!doctype html><meta charset=utf-8><body style="margin:0;background:#000">
<script src="../px.js"></script><script src="../rock.js"></script><script src="../hero.js"></script><script src="../actor.js"></script>
<script src="../scenery.js"></script><script src="../core.js"></script><script src="../realms/_bridge.js"></script>
<script>
const q = new URLSearchParams(location.search);
const realm = q.get('realm') || 'hills';
const w = parseInt(q.get('w') || '480'), h = parseInt(q.get('h') || '300');
const alt = parseFloat(q.get('alt') || '0'), zoom = parseFloat(q.get('zoom') || '0.74'), slope = parseFloat(q.get('slope') || '0.03');
const ratio = parseFloat(q.get('ratio') || (w / h > 1.0 ? '0.68' : '0.60')), open = parseFloat(q.get('open') || '1');
const t = parseFloat(q.get('t') || '3');
window.HERO_DEBUG = q.get('dbg') === '1'; window.__errs = []; window.addEventListener('error', e => __errs.push(String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
const src = document.createElement('script'); src.src = '../realms/' + realm + '.js';
src.onerror = () => { document.title = 'error: cannot load realms/' + realm + '.js'; };
src.onload = function () {
  const cv = document.createElement('canvas'); cv.id = 'game'; cv.width = w; cv.height = h; document.body.appendChild(cv);
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const ANCHOR_X = Math.round(w * 0.42), ANCHOR_Y = Math.round(h * ratio), HORIZON = Math.round(h * (ratio - 0.04));
  const camT = (function () { let x = Math.max(0, Math.min(1, alt / 1800)); return x * x * (3 - 2 * x); })();
  const focusX = Math.round(ANCHOR_X + (w * 0.31 - ANCHOR_X) * camT), focusY = Math.round(ANCHOR_Y + (h * 0.68 - ANCHOR_Y) * camT);
  const ztx = Math.round(focusX - ANCHOR_X * zoom), zty = Math.round(focusY - ANCHOR_Y * zoom) + Math.round((1 - open) * h * 0.15);
  const scroll = alt * 7.2, lip = new Int16Array(w);
  for (let x = 0; x < w; x++) { const xl = (x - ztx) / zoom; lip[x] = Math.round(zty + (ANCHOR_Y - slope * (xl - ANCHOR_X)) * zoom); }
  const cairns = [];
  for (let m = 100; m < alt + 400; m += 100) { const x = ANCHOR_X - 12 + (m - alt) * 7.2; if (x > (0 - ztx) / zoom - 20 && x < (w - ztx) / zoom + 20) cairns.push({ m: m, x: x }); }
  const S = { w, h, zoom, ztx, zty, altitude: alt, scroll, tSec: t, reduced: false, anchorX: ANCHOR_X, anchorY: ANCHOR_Y, horizonY: HORIZON, lip, slope, openingT: open, realmId: realm,
    windGust: parseFloat(q.get('wind') || '0'), gameState: 'playing', pull: 0, bestM: parseFloat(q.get('best') || '0'), oldBestPassed: false, cairns: q.get('cairns') === '0' ? [] : cairns };
  // the game's own stone sizing (index.html: boulderScaleNow / v8Geometry): scale 0.62 -> 2.85 over 1200 m (smoothstep), radius 32 * 1.32 * scale
  const ss = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const theta = Math.atan(slope), s = 1.32, scl = q.get('scl') ? parseFloat(q.get('scl')) : 0.62 + (2.85 - 0.62) * ss(alt / 1200), brad = Math.round(32 * s * scl);
  const growT = Math.max(0, Math.min(1, (scl - 1) / (2.85 - 1)));
  const bly = -brad + 2 * s, blx = Math.round((19 - 11 * growT) * s) + brad;
  const RL = V8.realms[realm], L = RL.light ? RL.light(S) : { x: w * 0.4, y: h * 0.15, k: 0.8, col: [255, 236, 190], ambient: [96, 150, 200], bright: 0.9, ground: [70, 110, 44] };
  const ox = ztx + ANCHOR_X * zoom, oy = zty + (ANCHOR_Y + 3) * zoom;
  const rcx = ox + zoom * (blx * Math.cos(theta) + bly * Math.sin(theta)), rcy = oy + zoom * (-blx * Math.sin(theta) + bly * Math.cos(theta));
  let dx = L.x - rcx, dy = L.y - rcy; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
  const A = { z: zoom, s, ox, oy, theta, blx, bly, brad, ratio: brad / (32 * s), roll: t * 2.1, squash: 0, lurchX: 0, manBaseX: 0, mode: q.get('mode') || 'push', wp: t * 0.78, activity: parseFloat(q.get('act') || '1'), effort: 0.9, slideEffort: 0, brace: parseFloat(q.get('brace') || '0'), stumble: parseFloat(q.get('stumble') || '0'), pushDrive: parseFloat(q.get('pd') || '0'), windLean: parseFloat(q.get('wl') || '0'), groove: 0,
    cheer: { release: parseFloat(q.get('rel') || '1'), arms: parseFloat(q.get('arms') || '1'), jump: parseFloat(q.get('jump') || '0.4') },
    tSec: t, pushTime: 3, reduced: false, playing: true, cosmetic: q.get('cos') || 'none', look: q.get('look') || 'shadow',
    light: [dx, dy], sunK: L.k, sunCol: L.col, ambient: L.ambient, bright: L.bright, ground: L.ground, rockMat: RL.rock.mat, rockStyle: RL.rock.style,
    lipAt: (sx) => lip[Math.max(0, Math.min(w - 1, Math.round(sx)))] };
  if (q.get('prof')) {                                        // per-stage timing (ms per call, averaged): ?prof=1
    V8.ensure(S); const R2 = V8.realm, fb2 = V8.fb, pal2 = V8.pal, N = 60, tm = {};
    const time = (name, fn) => { const s = performance.now(); for (let i = 0; i < N; i++) fn(); tm[name] = +((performance.now() - s) / N).toFixed(2); };
    time('backdrop', () => R2.backdrop(fb2, S, pal2)); time('ground', () => R2.ground(fb2, S, pal2));
    time('markers', () => V8.markers(fb2, S, pal2, R2)); time('front', () => R2.front && R2.front(fb2, S, pal2, null));
    time('actor', () => V8Actor.frameFb(fb2, pal2, A, V8.shade1, V8.shade2)); time('present', () => fb2.present(g, pal2));
    time('all', () => V8.render(g, S, A));
    document.title = 'ready ' + JSON.stringify(tm); return;
  }
  const t0 = performance.now(); for (let i = 0; i < 20; i++) V8.render(g, S, A);
  document.title = 'ready ' + ((performance.now() - t0) / 20).toFixed(2) + 'ms/frame';
};
document.body.appendChild(src);
</script>
